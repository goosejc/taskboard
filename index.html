<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Taskboard</title>
  <meta name="description" content="All your project tasks in one place, works offline.">
  <meta name="theme-color" content="#4f46e5">
  <!-- iPhone home-screen app settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Taskboard">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="viewTitle">Today</h1>
    <div class="topbar-actions">
      <button class="icon-btn" id="searchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </button>
    </div>
  </header>

  <div class="searchbar" id="searchbar" hidden>
    <input type="search" id="searchInput" placeholder="Search tasks…" autocomplete="off">
  </div>

  <div class="offline-pill" id="offlinePill" hidden>Offline — changes are saved on this device</div>

  <main id="main"></main>

  <button class="fab" id="addBtn" aria-label="Add task">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar">
    <button data-view="today" class="active">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Today</span>
    </button>
    <button data-view="upcoming">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Upcoming</span>
    </button>
    <button data-view="projects">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Projects</span>
    </button>
    <button data-view="all">
      <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m4 6 1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>
      <span>All</span>
    </button>
  </nav>

  <!-- Task editor -->
  <dialog id="taskDialog" class="sheet">
    <form id="taskForm" method="dialog">
      <div class="sheet-head">
        <button type="button" class="text-btn" data-close>Cancel</button>
        <h2 id="taskDialogTitle">New task</h2>
        <button type="submit" class="text-btn strong">Save</button>
      </div>
      <label class="field">
        <span>Task</span>
        <input name="title" required placeholder="What needs doing?" autocomplete="off">
      </label>
      <label class="field">
        <span>Project</span>
        <select name="projectId"></select>
      </label>
      <div class="field-row">
        <label class="field">
          <span>Due</span>
          <input type="date" name="due">
        </label>
        <label class="field">
          <span>Priority</span>
          <select name="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </label>
      </div>
      <div class="field">
        <span>Status</span>
        <div class="segmented" id="statusSeg">
          <label><input type="radio" name="status" value="todo" checked><span>To do</span></label>
          <label><input type="radio" name="status" value="doing"><span>In progress</span></label>
          <label><input type="radio" name="status" value="done"><span>Done</span></label>
        </div>
      </div>
      <label class="field">
        <span>Notes</span>
        <textarea name="notes" rows="4" placeholder="Details, links, next steps…"></textarea>
      </label>
      <button type="button" class="danger-btn" id="deleteTaskBtn" hidden>Delete task</button>
    </form>
  </dialog>

  <!-- Project editor -->
  <dialog id="projectDialog" class="sheet">
    <form id="projectForm" method="dialog">
      <div class="sheet-head">
        <button type="button" class="text-btn" data-close>Cancel</button>
        <h2 id="projectDialogTitle">New project</h2>
        <button type="submit" class="text-btn strong">Save</button>
      </div>
      <label class="field">
        <span>Name</span>
        <input name="name" required placeholder="Project name" autocomplete="off">
      </label>
      <div class="field">
        <span>Color</span>
        <div class="swatches" id="swatches"></div>
      </div>
      <button type="button" class="danger-btn" id="deleteProjectBtn" hidden>Delete project and its tasks</button>
    </form>
  </dialog>

  <!-- Settings -->
  <dialog id="settingsDialog" class="sheet">
    <div class="sheet-head">
      <span></span>
      <h2>Settings</h2>
      <button type="button" class="text-btn strong" data-close>Done</button>
    </div>
    <div class="settings-list">
      <label class="setting">
        <span>Show completed tasks</span>
        <input type="checkbox" id="showDoneToggle">
      </label>
      <button class="setting" id="exportBtn"><span>Export backup (.json)</span><span class="chev">›</span></button>
      <label class="setting" for="importInput"><span>Import backup</span><span class="chev">›</span></label>
      <input type="file" id="importInput" accept="application/json,.json" hidden>
      <p class="hint" id="storageInfo"></p>
    </div>
  </dialog>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
